spring:
  application:
    name: concert
  datasource:
    name: HangHaePlusDataSource
    type: com.zaxxer.hikari.HikariDataSource
    hikari:
      maximum-pool-size: 50
      connection-timeout: 10000
      max-lifetime: 60000
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    open-in-view: false
    generate-ddl: false
    show-sql: false
    hibernate:
      ddl-auto: update
    properties:
      hibernate.timezone.default_storage: NORMALIZE_UTC
      hibernate.jdbc.time_zone: UTC
  profiles:
    active: local

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui

---
spring.config.activate.on-profile: local,test

spring:
  datasource:
    url: jdbc:mysql://localhost:3310/concert?characterEncoding=UTF-8&serverTimezone=UTC
    username: users
    password: password

  data:
    redis:
      host: localhost
      port: 6379
      password:
      timeout: 1000
